version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ataeru_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ataeru_user
      POSTGRES_PASSWORD: ataeru_password
      POSTGRES_DB: ataeru_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ataeru_user -d ataeru_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ataeru_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: